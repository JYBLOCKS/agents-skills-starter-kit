artifact_type: agent
normalized_path_pattern: agents/<role>.md
required_questions:
  - role_name
  - mission
  - in_scope
  - out_of_scope
  - trigger_conditions
  - decision_boundaries
  - inputs
  - outputs
  - required_context
  - supported_skills
conditional_questions:
  - condition: requires_other_artifacts
    ask:
      - dependency_artifacts
  - condition: tool_specific_behavior
    ask:
      - adapter_notes
contract_mapping:
  - agents/CONTRACT.md
  - templates/agent.md
validation_checks:
  - the canonical flat agent file is drafted
  - role and path follow repository naming rules
  - contract fields are fully covered
